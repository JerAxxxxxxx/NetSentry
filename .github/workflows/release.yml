name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build embedded assets before go test; dist is intentionally not tracked.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run tests
        run: go test -count=1 ./...

      - name: Static checks
        run: go vet ./...

      - name: Test release packaging
        run: ./scripts/test-package-release.ps1

      - name: Install matching Wails CLI
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Build Windows executable
        run: wails build -platform windows/amd64 -s -m -nosyncgomod -trimpath -webview2 download

      - name: Prepare executable and checksums
        run: ./scripts/package-release.ps1

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bin/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Create release with Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Keep beta/rc tags out of the stable release channel.
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" \
            release/NetSentry-windows-amd64.exe release/LICENSE release/SHA256SUMS.txt \
            --verify-tag --title "NetSentry $RELEASE_TAG" --generate-notes \
            --notes "Windows x64: download NetSentry-windows-amd64.exe to a writable folder and double-click. No Go or Node.js installation is needed. Microsoft WebView2 Runtime is required; if missing, the app offers an online installation. SHA256SUMS.txt contains file checksums. This executable is not code-signed." \
            "${flags[@]}"
